plugins {
    id 'java'
    id "com.github.davidmc24.gradle.plugin.avro" version "1.9.1"
}

group = 'com.kingshuk.messaging.kafka'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        name = "confluent"
        url = "http://packages.confluent.io/maven/"
        allowInsecureProtocol = true
    }
}


dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation 'org.apache.kafka:kafka-streams:3.6.0'

    implementation 'org.projectlombok:lombok:1.18.26'
    annotationProcessor 'org.projectlombok:lombok:1.18.26'

    implementation 'org.apache.commons:commons-lang3:3.12.0'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.16.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.0'

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.1.0-alpha1'

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-simple
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: '2.1.0-alpha1'

}

sourceSets{
    main{
        java.srcDirs 'src/main/java', 'build/generated-main-avro-java'
        resources.srcDirs 'src/main/resources'
    }

    test{
        java.srcDirs 'src/test/java'
        resources.srcDirs 'src/test/resources'
    }
}

test {
    useJUnitPlatform()
}